name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The title's own platform. No GPU: D3D12 lands on WARP, the software
  # adapter a machine without one falls back to, so the device tests run.
  check:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Includes xtask's repository_passes_policy, the asset-policy check.
      # --no-fail-fast: one failing binary does not hide the ones after it.
      - name: Tests
        run: cargo test --workspace --locked --no-fail-fast

  # The Linux/Wine harness (docs/linux.md): cross-compile for the Windows
  # target with the MSVC CRT/SDK from xwin and run the test exes under Wine.
  # A runner has no GPU, so D3D12 is vkd3d-proton on Mesa's lavapipe
  # (software Vulkan): the device tests run there, and one that needs what
  # the device does not have skips with a printed reason, as on WARP.
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      WINEPREFIX: ${{ github.workspace }}/target/wine-prefix
      WINEDEBUG: "-all"
      # mscoree/mshtml: WineHQ's wineboot asks to download Mono and Gecko,
      # and that dialog hangs a headless runner (seen as a wineboot stuck in
      # setupapi's InstallHinfSection). The tests need neither.
      WINEDLLOVERRIDES: "d3d12,d3d12core=n;winedbg.exe=d;mscoree=d;mshtml=d"
      # WineHQ's official 11.x, not Ubuntu 24.04's wine64 9.0: the newest
      # watch/shadow guard-page tests fail alone on Wine 9 (docs/linux.md §1
      # asks for Wine 11.x). `wine-devel` gives /opt/wine-devel/bin/{wine,wineserver}.
      WINE: /opt/wine-devel/bin/wine
      WINESERVER: /opt/wine-devel/bin/wineserver
      WINEHQ_VERSION: "11.23~noble-1"
      # Pinned so a run is the same harness every time (docs/linux.md §1-2).
      XWIN_VERSION: "0.10.0"
      VKD3D_PROTON_VERSION: "3.1"
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml, target too.
      - run: rustup toolchain install
      - name: Packages
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm xvfb xauth mesa-vulkan-drivers libvulkan1 zstd \
            libc6:i386 libstdc++6:i386 libfreetype6:i386
          # WineHQ's own repository: the distribution's Wine 9 lacks the
          # guard-page behaviour the watch tests need.
          sudo mkdir -pm755 /etc/apt/keyrings
          sudo curl -fsSL -o /etc/apt/keyrings/winehq-archive.key \
            https://dl.winehq.org/wine-builds/winehq.key
          . /etc/os-release
          sudo curl -fsSL -o /etc/apt/sources.list.d/winehq.sources \
            "https://dl.winehq.org/wine-builds/ubuntu/dists/${UBUNTU_CODENAME}/winehq-${UBUNTU_CODENAME}.sources"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "winehq-devel=$WINEHQ_VERSION"
          # Ubuntu keeps clang-cl under LLVM's own bin and links only clang.
          llvm=$(ls -d /usr/lib/llvm-* | sort -V | tail -1)
          for tool in clang-cl lld-link llvm-lib; do
            command -v "$tool" >/dev/null || sudo ln -sf "$llvm/bin/$tool" "/usr/local/bin/$tool"
          done
          clang-cl --version | head -1
          "$WINE" --version
      - name: Cache xwin's CRT/SDK and vkd3d-proton
        uses: actions/cache@v4
        with:
          path: |
            ~/.xwin
            ~/.xwin-cache
            ~/vkd3d-proton
          key: linux-wine-${{ env.XWIN_VERSION }}-${{ env.VKD3D_PROTON_VERSION }}
      - name: xwin splat
        run: |
          if [ ! -d ~/.xwin/crt ]; then
            cargo install xwin --version "$XWIN_VERSION"
            # xwin caches downloads in ./.xwin-cache unless told otherwise;
            # that put the CRT/SDK's .vsix files in the checkout and the
            # asset-policy step (correctly) refused them.
            xwin --accept-license --cache-dir "$HOME/.xwin-cache" \
              splat --output ~/.xwin
          fi
      - name: vkd3d-proton
        run: |
          if [ ! -d ~/vkd3d-proton/x64 ]; then
            curl -fsSL -o /tmp/vkd3d.tar.zst \
              "https://github.com/HansKristian-Work/vkd3d-proton/releases/download/v$VKD3D_PROTON_VERSION/vkd3d-proton-$VKD3D_PROTON_VERSION.tar.zst"
            tar --zstd -xf /tmp/vkd3d.tar.zst -C /tmp
            mv "/tmp/vkd3d-proton-$VKD3D_PROTON_VERSION" ~/vkd3d-proton
          fi
          ls ~/vkd3d-proton/x64
      - name: Clippy
        run: |
          . tools/linux/env.sh
          cargo clippy --workspace --all-targets --locked \
            --target x86_64-pc-windows-msvc -- -D warnings
          cargo clippy --workspace --all-targets --all-features --locked \
            --target x86_64-pc-windows-msvc -- -D warnings
      # Runs on Linux: the test that does it under Wine has no `git` there,
      # and the run below skips it (this step is that check).
      - name: Asset policy
        run: cargo xtask policy
      - name: Build the test exes
        run: |
          . tools/linux/env.sh
          cargo test --workspace --locked --no-run \
            --target x86_64-pc-windows-msvc \
            --message-format=json > target/test-binaries.json
          jq -r 'select(.reason == "compiler-artifact" and .profile.test) |
                 .executable | select(. != null)' \
            target/test-binaries.json | sort -u > target/test-exes.txt
          wc -l < target/test-exes.txt
      - name: Wine prefix
        run: |
          mkdir -p "$WINEPREFIX"
          # A prefix of this run's own, as `cargo xtask wine-test` makes one.
          xvfb-run -a "$WINE" wineboot -i
          "$WINE" --version
          # vkd3d-proton's D3D12 in place of Wine's own (no shader model 6.6).
          cp ~/vkd3d-proton/x64/d3d12.dll ~/vkd3d-proton/x64/d3d12core.dll \
            "$WINEPREFIX/drive_c/windows/system32/"
      - name: Tests under Wine
        run: |
          . tools/linux/env.sh
          # The loader's end-to-end test cannot start cargo from inside Wine:
          # build its fixture here and name it, as `cargo xtask wine-test` does.
          cargo build --quiet --target x86_64-pc-windows-msvc \
            --manifest-path tests/fixtures/hle-probe/Cargo.toml \
            --target-dir target/hle-probe
          export VICTORY_HLE_PROBE="Z:$(realpath target/hle-probe/x86_64-pc-windows-msvc/debug/hle_probe.dll | tr / '\\')"
          status=0
          while read -r exe; do
            name=$(basename "$exe")
            # One GPU: tests sharing it collide (docs/linux.md §5).
            args=(--test-threads=1)
            # The policy test runs `git`, which Wine does not have; the step
            # above is that check on this platform.
            case "$name" in
              xtask-*) args+=(--skip policy::tests::repository_passes_policy) ;;
            esac
            echo "::group::$name"
            case "$name" in
              # Wine deadlocks mapping several images in one process (the
              # windows::tests group hangs when run together, each test passes
              # alone): run that binary's tests one process each.
              victory_loader-*)
                "$WINE" "$exe" --list 2>/dev/null | sed 's/: test$//' \
                  | while read -r one; do
                      timeout --signal=KILL --kill-after=30 120 \
                        xvfb-run -a "$WINE" "$exe" --test-threads=1 --exact "$one" \
                        || { echo "::error::$one failed"; exit 1; }
                    done || { echo "::error::$name failed"; status=1; }
                ;;
              *)
                timeout --signal=KILL --kill-after=30 600 xvfb-run -a "$WINE" "$exe" "${args[@]}" \
                  || { echo "::error::$name failed"; status=1; }
                ;;
            esac
            # This prefix is the job's own: nothing of a binary outlives it
            # (a lingering wineserver holds the step's output open).
            "$WINESERVER" -k 2>/dev/null || true
            echo "::endgroup::"
          done < target/test-exes.txt
          exit "$status"
